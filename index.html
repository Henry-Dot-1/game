            position: absolute;

            align-items: center;

            transform: scale(1.1) rotate(30deg);

        }
        #settings-icon svg {
            width: 26px;
            height: 26px;
            stroke: #f0e6d0;
            stroke-width: 2.2;
        }
#settings-panel {
    position: absolute;
    top: 80px;
    right: 20px;
    background: rgba(15, 15, 30, 0.95);
    backdrop-filter: blur(18px);
    color: #eee;
    padding: 24px 28px;
    border-radius: 18px;
    z-index: 35;
    min-width: 220px;
    box-shadow: 0 12px 50px rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
    transform: translateY(-10px) scale(0.96);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;                 /* всё внутри заблокировано */
    max-height: 65vh;
    overflow-y: auto;
    padding-bottom: 20px;
}

#settings-panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;                 /* всё внутри разблокировано */
}

/* Важно: перекрыть любые попытки внутренних элементов быть кликабельными */
#settings-panel * {
    pointer-events: none;
}

#settings-panel.open * {
    pointer-events: auto;
}

#settings-panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto; /* ← открыто — можно кликать */
}

    <script>
        // ============================================================
        //  HAPPY BIRTHDAY ALINA — FINAL VERSION (WITH MOVABLE BOXES)
        // ============================================================

        // ---- CONSTANTS ----
        const V_W = 1920,
            V_H = 1080,
            SCALE = 1.8;
            // ========== АВТОМАТИЧЕСКАЯ РЕГУЛИРОВКА КАЧЕСТВА ==========
let qualityLevel = 0;
let fpsHistory = [];
let fpsCounter = 0;
let lastFpsUpdate = performance.now();
let currentFps = 60;
const FPS_SAMPLE_SIZE = 30;
const FPS_HIGH_THRESHOLD = 55;
const FPS_LOW_THRESHOLD = 42;
let qualitySettings = {
    shadows: true,
    particles: 1,
    enemySkip: 1,
    resolutionScale: 1
};

function applyQualitySettings() {
    const level = qualityLevel;
    qualitySettings.shadows = level === 0;
    qualitySettings.particles = level === 0 ? 1 : (level === 1 ? 0.6 : 0.3);
    qualitySettings.enemySkip = level === 2 ? 2 : 1;
    qualitySettings.resolutionScale = level === 0 ? 1 : (level === 1 ? 0.75 : 0.5);
    resizeCanvas();
    console.log('🎮 Качество:', level === 0 ? 'Высокое' : level === 1 ? 'Среднее' : 'Низкое');
}
// ==========================================================
        const GRAVITY = 0.68 * SCALE;
        const MAX_FALL = 16 * SCALE;
        const PLAYER_SPEED = 4.8 * SCALE;// 4.8
        const JUMP_FORCE = 14.8 * SCALE; //14.8
        const COYOTE_FRAMES = 6;
        const BUFFER_FRAMES = 6;
        const WORLD_W = 9000 * SCALE;
        const GROUND_Y = 780 * SCALE;

        // ---- CANVAS SETUP ----
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // ---- DOM REFS ----
        const loadingEl = document.getElementById('loading');
        const loadProgressEl = document.getElementById('load-progress');
        const settingsIcon = document.getElementById('settings-icon');
        const settingsPanel = document.getElementById('settings-panel');
        const closeSettingsBtn = document.getElementById('close-settings');
        const touchControls = document.getElementById('touch-controls');
        const radioKeyboard = document.querySelector('input[value="keyboard"]');
        const radioTouch = document.querySelector('input[value="touch"]');
        const btnRestartLevel = document.getElementById('btn-restart-level');

        const maxwellVideo = document.getElementById('maxwell-video');
    
        const videoContainer = document.getElementById('video-container');

        const closeVidBtn = document.getElementById('close-vid-btn');
        const nyanContainer = document.getElementById('nyan-container');
        const nyanCanvas = document.getElementById('nyan-canvas');

        // ---- LOADING ----
        let assetsLoaded = 0,
            totalAssets = 45;

        function assetLoaded() {
            assetsLoaded++;
            const pct = Math.round((assetsLoaded / totalAssets) * 100);
            loadProgressEl.textContent = pct + '%';
if (assetsLoaded >= totalAssets) {
    loadingEl.style.display = 'none';
}
        }

        function loadImg(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => { assetLoaded();
                    resolve(img); };
                img.onerror = () => { assetLoaded();
                    resolve(null); };
                img.src = src;
            });
        }

        function loadVideo(src) {
            return new Promise(resolve => {
                const vid = document.createElement('video');
                vid.preload = 'auto';
                vid.onloadeddata = () => { assetLoaded();
                    resolve(vid); };
                vid.onerror = () => { assetLoaded();
                    resolve(null); };
                vid.src = src;
                vid.load();

                    // Нормализация размеров спрайтов (приводим idle, walk, jump к единому размеру)
function normalizeSprites(arr, targetW, targetH) {
    for (let i = 0; i < arr.length; i++) {
        const img = arr[i];
        if (!img || !img.complete || img.naturalWidth === 0) continue;
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        const aspect = img.naturalWidth / img.naturalHeight;
        const targetAspect = targetW / targetH;
        let dw, dh;
        if (aspect > targetAspect) {
            dw = targetW;
            dh = targetW / aspect;
        } else {
            dh = targetH;
            dw = targetH * aspect;
        }
        const dx = (targetW - dw) / 2;
        const dy = (targetH - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
        arr[i] = canvas; // заменяем на canvas
    }
}

        // ---- SOUND EFFECTS ----
        function playTone(freq, dur, type = 'sine', vol = 0.12, delay = 0) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + delay);
                osc.stop(audioCtx.currentTime + delay + dur);
            } catch (_) {}
        }

function spawnParticles(x, y, count, color, speed, life, sizeRange) {
    const multiplier = qualitySettings.particles || 1;
    const realCount = Math.max(1, Math.floor(count * multiplier));
    for (let i = 0; i < realCount; i++) {
        const angle = rand(0, Math.PI * 2);
        const spd = rand(0.5, speed) * SCALE;
        state.particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - rand(0, 0.4) * SCALE,
            life: rand(life * 0.5, life),
            maxLife: life,
            size: rand(sizeRange[0], sizeRange[1]) * SCALE,
            color,
            gravity: 0.03 * SCALE,
            alpha: 1
        });
    }
}


        function spawnFloatingText(x, y, text, color = '#fff', size = 28) {

                    SCALE, alpha: 1 });
        }

        function updateParticles() {
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.life--;
                p.alpha = p.life / p.maxLife;
                p.size *= 0.998;
                if (p.life <= 0 || p.size < 0.5) state.particles.splice(i, 1);
            }
            for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
                const ft = state.floatingTexts[i];
                ft.y += ft.vy;
                ft.life--;
                ft.alpha = ft.life / ft.maxLife;
                if (ft.life <= 0) state.floatingTexts.splice(i, 1);

function canBoxMove(box, dir) {
    const step = 2 * SCALE;
    
    // Находим все коробки, которые образуют сплошную цепочку в направлении dir
    const chain = [];
    let current = box;
    chain.push(current);
    
    // Ищем коробки, которые касаются текущей в направлении
    let found = true;
    while (found) {
        found = false;
        const nextX = dir > 0 ? current.x + current.w : current.x - step;
        // Проверяем, есть ли коробка, которая пересекается по вертикали и находится прямо перед current
        for (const other of state.boxes) {
            if (chain.includes(other)) continue;
            // Пересечение по вертикали (с запасом)
            if (other.y + other.h > current.y && other.y < current.y + current.h) {
                // Проверяем, что other находится вплотную к current в направлении
                if (dir > 0 && other.x >= current.x + current.w && other.x - current.x - current.w < step) {
                    chain.push(other);
                    current = other;
                    found = true;
                    break;
                } else if (dir < 0 && other.x + other.w <= current.x && current.x - other.x - other.w < step) {
                    chain.push(other);
                    current = other;
                    found = true;
                    break;
                }
            }
        }
    }
    
    // Теперь проверяем, может ли каждая коробка в цепочке двигаться в направлении
    for (const b of chain) {
        const testX = b.x + (dir > 0 ? b.w + step : -step);
        // 1. Стены мира
        if (testX < 0 || testX + b.w > WORLD_W) return false;
        // 2. Платформы (горизонтальные стены)
        for (const plat of platforms) {
            if (b.y + b.h <= plat.y + 8 || b.y >= plat.y + plat.h - 8) continue;
            if (dir > 0) {
                if (b.x + b.w <= plat.x && testX + b.w > plat.x) return false;
            } else {
                if (b.x >= plat.x + plat.w && testX < plat.x + plat.w) return false;
            }
        }
    }
    return true;
}

                    p.x = box.x + box.w;
                }

    if (p.x < 0) p.x = 0;

function updateBoxes() {

        box.x += box.vx;
        box.y += box.vy;
        box.vx *= 0.92;
        box.angVel *= 0.92;
        box.angVel += box.vx * 0.04;
        box.angle += box.angVel;
    }

    for (const box of boxes) {
        for (const plat of platforms) {
            if (box.y + box.h <= plat.y + 8 || box.y >= plat.y + plat.h - 8) continue;
            if (box.x + box.w > plat.x && box.x < plat.x + plat.w) {
                if (box.vx > 0 && box.x + box.w - box.vx <= plat.x + 4) {
                    box.x = plat.x - box.w;
                    box.vx = -box.vx * 0.4;
                    box.angVel += (Math.random() - 0.5) * 0.3;
                } else if (box.vx < 0 && box.x - box.vx >= plat.x + plat.w - 4) {
                    box.x = plat.x + plat.w;
                    box.vx = -box.vx * 0.4;
                    box.angVel += (Math.random() - 0.5) * 0.3;
                }
            }
        }

        for (const other of boxes) {
            if (other === box) continue;
            if (box.y + box.h > other.y && box.y < other.y + other.h) {
                if (box.x + box.w > other.x && box.x < other.x + other.w) {
                    const relVx = box.vx - other.vx;
                    if (relVx > 0 && box.x < other.x) {
                        const impulse = relVx * 0.5;
                        box.vx -= impulse;
                        other.vx += impulse;
                        box.angVel += impulse * 0.3;
                        other.angVel -= impulse * 0.3;
                        box.x = other.x - box.w;
                    } else if (relVx < 0 && box.x > other.x) {
                        const impulse = relVx * 0.5;
                        box.vx -= impulse;
                        other.vx += impulse;
                        box.angVel += impulse * 0.3;
                        other.angVel -= impulse * 0.3;
                        box.x = other.x + other.w;
                    } else {
                        if (box.x < other.x) {
                            box.x = other.x - box.w;
                        } else {
                            box.x = other.x + other.w;
                        }
                        box.vx = 0;
                        other.vx = 0;
                    }

        }
    }

    for (const box of boxes) {

        for (const plat of platforms) {

            if (box.vy >= 0 && box.y + box.h > plat.y && box.y + box.h - box.vy <= plat.y + 6) {
                box.y = plat.y - box.h;

                box.angVel += (Math.random() - 0.5) * 0.2;
            }
        }

        for (const other of boxes) {
            if (other === box) continue;
            if (box.x + box.w > other.x && box.x < other.x + other.w) {
                if (box.vy >= 0 && box.y + box.h > other.y && box.y + box.h - box.vy <= other.y + 6) {
                    box.y = other.y - box.h;
                    box.vy = -box.vy * 0.3;
                    box.grounded = true;
                    box.angVel += (Math.random() - 0.5) * 0.2;
                    other.angVel += (Math.random() - 0.5) * 0.2;
                } else if (box.vy < 0 && box.y < other.y + other.h && box.y - box.vy >= other.y + other.h - 6) {
                    box.y = other.y + other.h;
                    box.vy = -box.vy * 0.3;
                    box.angVel += (Math.random() - 0.5) * 0.2;

        if (pit && state.pitActive) {
            if (box.x + box.w > pit.x && box.x < pit.x + pit.w && box.y + box.h > pit.y) {
                box.vy = Math.max(box.vy, 8 * SCALE);

                    if (idx > -1) state.boxes.splice(idx, 1);

        if (box.x < 0) { box.x = 0; box.vx = -box.vx * 0.4; box.angVel += 0.2; }
        if (box.x > WORLD_W - box.w) { box.x = WORLD_W - box.w; box.vx = -box.vx * 0.4; box.angVel -= 0.2; }

function updateGate() {
    if (!gate) return;
    const cx = state.player.x + state.player.w / 2;
    const cy = state.player.y + state.player.h / 2;
    const gx = gate.x + gate.w / 2;
    const gy = gate.y + gate.h / 2;
    const d = dist(cx, cy, gx, gy);

    // Уменьшенные пороги: открывается при 100px, закрывается при 150px
    const nearThreshold = 200 * SCALE;
    const farThreshold = 350 * SCALE;
    if (d < nearThreshold) {
        state.gateOpen = true;
    } else if (d > farThreshold) {
        state.gateOpen = false;
    }

    // Кнопка появляется только когда ворота открыты и все плюши собраны
    const allCollected = plushes.every(p => p.collected);
    if (state.gateOpen && allCollected) {
        if (d < 500 * SCALE) {
            state.gateButtonRect = {
                x: gate.x + gate.w / 2 - 80,
                y: gate.y - 40, // подняли выше над воротами
                w: 160,
                h: 48
            };
        } else {
            state.gateButtonRect = null;
        }
    } else {
        state.gateButtonRect = null;
    }
}

        // ---- LEVEL END CHECK ----
function checkLevelEnd() {
    const p = state.player;
    const pCenterX = p.x + p.w / 2;
    const pCenterY = p.y + p.h / 2;

    // --- ПРОВЕРКА ЯМЫ ---
    if (levelEndType === 'pit' && pit) {
        if (p.x + p.w > pit.x && p.x < pit.x + pit.w && p.y + p.h > pit.y) {
            // Порог снижен для быстрого срабатывания
            if (p.y > V_H + 50) {
                if (state.pitActive) {
                    // Плюши собраны — переход
                    if (state.currentLevel >= LEVELS.length - 1) {
                        state.victoryTriggered = true;
                        sfxVictory();
                        spawnParticles(V_W / 2, V_H / 2, 100, '#ffd700', 12, 60, [5, 15]);
                        spawnParticles(V_W / 2 - 200, V_H / 2 - 100, 60, '#ff6b6b', 10, 50, [4, 12]);
                        spawnParticles(V_W / 2 + 200, V_H / 2 - 100, 60, '#4ecdc4', 10, 50, [4, 12]);
                        setTimeout(() => {
                            if (!state.creditsStarted) { state.creditsStarted = true; startCredits(); }
                        }, 3000);
                    } else {
                        state.currentLevel++;
                        saveProgress();
                        loadLevel(state.currentLevel);
                    }
                    state.fallingInPit = false;
                    return;
                } else {
                    // Плюши НЕ собраны — сообщение только один раз
                    if (!state.pitMessageShown) {
                        state.pitMessageShown = true;
                        activeMessage = null;
                        showMessage('Где-то спрятался ещё один участник группы! 🕵️', '#ffaa44', 360);
                        setTimeout(() => {
                            respawnAtCheckpoint();
                        }, 1500);
                    }
                    return;
                }
            }
        }
    }

    // Остальная логика (gate, cake) без изменений
    if (levelEndType === 'gate' && gate && state.gateOpen) {
        const d = dist(pCenterX, pCenterY, gate.x + gate.w / 2, gate.y + gate.h / 2);
        if (d < 500 * SCALE && state.gateButtonRect) return;
    }

    if (levelEndType === 'cake') {
        const cakeX = levelEndX;
        const cakeY = levelEndY - 80 * SCALE;
        const d = dist(pCenterX, pCenterY, cakeX, cakeY);
        if (d < 200 * SCALE && !state.levelEndReached) {
            state.levelEndReached = true;
            const allCollected = plushes.every(p => p.collected);
            if (allCollected) {
                state.victoryTriggered = true;
                sfxVictory();
                spawnParticles(V_W / 2, V_H / 2, 100, '#ffd700', 12, 60, [5, 15]);
                spawnParticles(V_W / 2 - 200, V_H / 2 - 100, 60, '#ff6b6b', 10, 50, [4, 12]);
                spawnParticles(V_W / 2 + 200, V_H / 2 - 100, 60, '#4ecdc4', 10, 50, [4, 12]);
                setTimeout(() => {
                    if (!state.creditsStarted) { state.creditsStarted = true; startCredits(); }
                }, 3000);
            } else {
                showMessage('🍰 Собери все плюши!', '#ffd700', 80);
                state.levelEndReached = false;
            }
        }
    }
}

                if (data.total !== undefined) state.totalPlushes = data.total;

                if (data.catMusic) state.catMusicFound = data.catMusic;

        // ---- CANVAS CLICK (GATE ENTER) ----
        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx, cy;
            if (e.touches) {
                if (e.type === 'touchend' && e.changedTouches.length) {
                    cx = e.changedTouches[0].clientX;
                    cy = e.changedTouches[0].clientY;
                } else if (e.touches.length) {
                    cx = e.touches[0].clientX;
                    cy = e.touches[0].clientY;
                } else return;
                e.preventDefault();
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            const mx = (cx - rect.left) * scaleX;
            const my = (cy - rect.top) * scaleY;
            const currentScale = canvas.width / V_W;
            const virtMx = mx / currentScale;
            const virtMy = my / currentScale;

            if (gate && state.gateOpen && state.gateButtonRect) {
                const gx = state.gateButtonRect.x - state.camera.x;
                const gy = state.gateButtonRect.y - state.camera.y;
                if (virtMx >= gx && virtMx <= gx + state.gateButtonRect.w &&
                    virtMy >= gy && virtMy <= gy + state.gateButtonRect.h) {
                    enterGate();
                }
            }
            if (state.paused) state.paused = false;
        }
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchend', handleCanvasClick);

                    ctx.shadowColor = 'rgba(255,215,0,0.3)';
                    ctx.shadowBlur = 50;
                    ctx.fillText(item.content, V_W / 2, y);
                    y += 120;
                } else if (item.type === 'pair') {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 48px Arial';
                    ctx.shadowColor = 'rgba(0,0,0,0)';
                    ctx.shadowBlur = 0;
                    ctx.fillText(item.big, V_W / 2, y);
                    y += 56;
                    ctx.fillStyle = '#ccc';
                    ctx.font = '26px Arial';
                    ctx.fillText(item.small, V_W / 2, y);
                    y += 90;
                }

        function drawCredits() {

            const lineHeight = 56;
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.88)';
            ctx.fillRect(0, 0, V_W, V_H);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

                if (item.type === 'text') {
                    const isBig = item.content.includes('🎂') || item.content.includes('Спасибо');
                    ctx.fillStyle = isBig ? '#ffd700' : '#fff';
                    ctx.font = isBig ? 'bold 52px Arial' : '26px Arial';
                    ctx.shadowColor = isBig ? 'rgba(255,215,0,0.3)' : 'rgba(0,0,0,0)';
                    ctx.shadowBlur = isBig ? 30 : 0;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.content, V_W / 2, y);
                    y += lineHeight;
                                                  } else if (item.type === 'image') {
                    const img = memeImages[item.key];
                    if (img && img.complete && img.naturalWidth > 0) {
                        const sz = 300; // размер картинки (можете менять)
                        const ix = V_W / 2 - sz / 2;
                        const iy = y; // <--- ИСПРАВЛЕНО: картинка начинается ровно от текущего y

                        ctx.shadowBlur = 20;
                        ctx.shadowColor = 'rgba(255,215,0,0.2)';
                        const aspect = img.naturalWidth / img.naturalHeight;
                        let dw = sz, dh = sz;
                        if (aspect > 1) { dh = sz / aspect; } else { dw = sz * aspect; }
                        ctx.drawImage(img, ix + (sz - dw) / 2, iy + (sz - dh) / 2, dw, dh);
                        
                        if (item.label) {
                            // Сдвигаем y вниз на высоту картинки + отступ для подписи
                            y += sz + 40;

        function playFnafVictorySound() {
            if (!audioCtx) return;
            try {
                const notes = [523, 659, 784, 1047];
                notes.forEach((f, i) => {
                    const o = audioCtx.createOscillator(),
                        g = audioCtx.createGain();
                    o.type = 'square';
                    o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.15);
                    g.gain.setValueAtTime(0.06, audioCtx.currentTime + i * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.15);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + i * 0.15);
                    o.stop(audioCtx.currentTime + i * 0.15 + 0.15);
                });
            } catch (_) {}
        }

function resizeCanvas() {
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    const aspect = V_W / V_H;
    const dpr = window.devicePixelRatio || 1;
    const scale = qualitySettings.resolutionScale || 1;
    
    let logicalW = Math.min(ww * dpr, 1200) * scale;
    let logicalH = logicalW / aspect;
    logicalW = Math.floor(logicalW);
    logicalH = Math.floor(logicalH);
    
    canvas.width = logicalW;
    canvas.height = logicalH;
    canvas.style.width = ww + 'px';
    canvas.style.height = wh + 'px';
    
    if (nyanCanvas) {
        nyanCanvas.width = ww;
        nyanCanvas.height = wh;
        nyanCanvas.style.width = ww + 'px';

    }
}

        function drawPlatforms() {
            const cx = state.camera.x,
                cy = state.camera.y;
            for (const p of platforms) {
                const x = p.x - cx;
                const y = p.y - cy;
                const type = p.type || 'ground';
                ctx.save();

                if (type === 'ground') {
                    const grad = ctx.createLinearGradient(0, y, 0, y + p.h);
                    const theme = levelData.theme;
                    if (theme === 'forest') {
                        grad.addColorStop(0, '#5a8a3a');
                        grad.addColorStop(0.1, '#4a7a2a');
                        grad.addColorStop(0.5, '#3d6a1a');
                        grad.addColorStop(1, '#2d4a12');
                    } else if (theme === 'hell') {
                        grad.addColorStop(0, '#5d2a12');
                        grad.addColorStop(0.1, '#4d1a0a');
                        grad.addColorStop(0.5, '#3d1508');
                        grad.addColorStop(1, '#2a0a04');
                    } else {
                        grad.addColorStop(0, '#f0e4ec');
                        grad.addColorStop(0.1, '#e8d4dc');
                        grad.addColorStop(0.5, '#d8c4cc');
                        grad.addColorStop(1, '#c8b4bc');
                    }
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, p.w, p.h);

                    if (theme === 'forest') {
                        ctx.fillStyle = 'rgba(80,160,60,0.3)';
                        for (let i = 0; i < p.w; i += 8) {
                            const hOff = Math.sin(i * 0.5 + cx * 0.01) * 3 + 4;
                            ctx.fillRect(x + i, y - hOff, 3, hOff);
                        }
                    }
                    if (theme === 'heaven') {
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        for (let i = 0; i < p.w; i += 12) {
                            const hOff = Math.sin(i * 0.3 + cx * 0.005) * 2 + 3;
                            ctx.fillRect(x + i, y - hOff, 2, hOff);
                        }
                    }
                } else if (type === 'log') {
                    const grad = ctx.createLinearGradient(0, y, 0, y + p.h);
                    grad.addColorStop(0, '#b8956a');
                    grad.addColorStop(0.3, '#a8855a');
                    grad.addColorStop(0.7, '#8a7050');
                    grad.addColorStop(1, '#6a5540');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0.2)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 2;
                    ctx.beginPath();
                    ctx.roundRect(x, y, p.w, p.h, 4);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(60,40,20,0.15)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < p.w; i += 20) {
                        ctx.beginPath();
                        ctx.moveTo(x + i + 6, y + 4);
                        ctx.quadraticCurveTo(x + i + 10, y + p.h / 2, x + i + 4, y + p.h - 4);
                        ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(60,120,40,0.15)';
                    for (let i = 0; i < p.w; i += 30) {
                        if (Math.sin(i * 0.7 + cx * 0.02) > 0.3) {
                            ctx.fillRect(x + i, y - 2, 8, 4);
                        }
                    }
                } else if (type === 'stone') {
                    const grad = ctx.createLinearGradient(0, y, 0, y + p.h);
                    grad.addColorStop(0, '#5a4a3a');
                    grad.addColorStop(0.3, '#4a3a2a');
                    grad.addColorStop(0.7, '#3a2a1a');
                    grad.addColorStop(1, '#2a1a0a');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 3;
                    ctx.beginPath();
                    ctx.roundRect(x, y, p.w, p.h, 3);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(30,20,10,0.2)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 3; i++) {
                        const sx = x + 20 + i * 40 + Math.sin(i * 2 + cx * 0.01) * 20;
                        ctx.beginPath();
                        ctx.moveTo(sx, y + 4);
                        ctx.quadraticCurveTo(sx + 8, y + p.h / 3, sx - 4, y + p.h - 4);
                        ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(255,80,20,0.05)';
                    ctx.fillRect(x, y + p.h - 6, p.w, 6);
                } else if (type === 'cloud' || type === 'cloud_ground') {
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 30;
                    const cloudColor = type === 'cloud_ground' ? 'rgba(240,235,245,0.6)' : 'rgba(255,255,255,0.55)';
                    const cloudColor2 = type === 'cloud_ground' ? 'rgba(230,225,235,0.8)' :
                        'rgba(255,255,255,0.75)';

                    ctx.fillStyle = cloudColor2;
                    const segments = Math.max(3, Math.floor(p.w / 60));
                    const segW = p.w / segments;
                    for (let i = 0; i < segments; i++) {
                        const cx2 = x + i * segW + segW / 2;
                        const r = segW * 0.5 + Math.sin(i * 1.7 + cx * 0.005) * segW * 0.15;
                        const yOff = Math.sin(i * 0.9 + cx * 0.008) * 4;
                        ctx.beginPath();
                        ctx.arc(cx2, y + p.h / 2 + yOff, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = cloudColor;
                    ctx.fillRect(x + 10, y + p.h * 0.35, p.w - 20, p.h * 0.65);

                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    for (let i = 0; i < segments; i++) {
                        const cx2 = x + i * segW + segW / 2;
                        const r = segW * 0.3 + Math.sin(i * 1.3 + cx * 0.006) * segW * 0.1;
                        ctx.beginPath();
                        ctx.arc(cx2, y + p.h * 0.3, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }
        }

function drawBoxes() {
    const cx = state.camera.x,
        cy = state.camera.y;
    for (const box of state.boxes) {
        const x = box.x - cx;
        const y = box.y - cy;
        ctx.save();
        ctx.translate(x + box.w / 2, y + box.h / 2);
        ctx.rotate(box.angle || 0);
        if (boxImg && boxImg.complete && boxImg.naturalWidth > 0) {

            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-box.w / 2, -box.h / 2, box.w, box.h);
            ctx.strokeStyle = '#5a2d0c';
            ctx.lineWidth = 2;
            ctx.strokeRect(-box.w / 2, -box.h / 2, box.w, box.h);
        }
        ctx.restore();
    }
}
        // ---- DRAW DECORATIONS ----
        function drawDecorations(layer) {
            const cx = state.camera.x,
                cy = state.camera.y;
            for (const d of decorations) {
                if (d.layer && d.layer !== layer) continue;
                if (!d.layer && layer !== 'back') continue;
                const x = d.x - cx;
                const y = d.y - cy;
                ctx.save();

                switch (d.type) {
                    case 'tree': {
                        const s = d.s || 1;
                        ctx.fillStyle = '#5a3a1a';
                        ctx.fillRect(x + 12 * s, y + 50 * s, 16 * s, 60 * s);
                        ctx.fillStyle = '#2a6a1a';
                        ctx.beginPath();
                        ctx.arc(x + 20 * s, y + 40 * s, 45 * s, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#3a7a2a';
                        ctx.beginPath();
                        ctx.arc(x - 10 * s, y + 55 * s, 30 * s, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x + 50 * s, y + 55 * s, 30 * s, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#2a5a1a';
                        ctx.beginPath();
                        ctx.arc(x + 20 * s, y + 25 * s, 30 * s, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case 'flower': {
                        const colors = ['#ff6b6b', '#ffd93d', '#ff6bb5', '#ff9f43', '#a29bfe'];
                        const col = colors[Math.floor(Math.abs(d.x + d.y) % colors.length)];
                        ctx.fillStyle = '#2d7a2d';
                        ctx.fillRect(x + 4, y + 16, 3, 20);
                        ctx.fillStyle = col;
                        for (let i = 0; i < 5; i++) {
                            const ang = i * 1.256 + Math.sin(d.x * 0.01) * 0.2;
                            ctx.beginPath();
                            ctx.ellipse(x + 6 + Math.cos(ang) * 5, y + 12 + Math.sin(ang) * 5, 4, 7, ang, 0, Math.PI *
                            2);
                            ctx.fill();
                        }
                        ctx.fillStyle = '#ffd700';
                        ctx.beginPath();
                        ctx.arc(x + 6, y + 12, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case 'mushroom': {
                        ctx.fillStyle = '#d4a373';
                        ctx.fillRect(x + 8, y + 24, 8, 16);
                        ctx.fillStyle = '#e74c3c';
                        ctx.beginPath();
                        ctx.ellipse(x + 12, y + 24, 16, 12, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        for (let i = 0; i < 4; i++) {
                            const mx = x + 6 + i * 5 + Math.sin(i * 2) * 2;
                            const my = y + 20 + Math.sin(i * 1.5) * 3;
                            ctx.beginPath();
                            ctx.arc(mx, my, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    }
                    case 'stump': {
                        ctx.fillStyle = '#6a4a2a';
                        ctx.fillRect(x, y + 20, 30, 20);
                        ctx.fillStyle = '#8a6a4a';
                        ctx.fillRect(x + 2, y + 18, 26, 6);
                        ctx.fillStyle = '#4a2a1a';
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            ctx.arc(x + 6 + i * 10, y + 26, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    }
                    case 'bush': {
                        ctx.fillStyle = '#2a6a1a';
                        ctx.beginPath();
                        ctx.arc(x + 20, y + 20, 24, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#3a7a2a';
                        ctx.beginPath();
                        ctx.arc(x + 8, y + 24, 16, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x + 32, y + 24, 16, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case 'rock': {
                        ctx.fillStyle = '#6a6a6a';
                        ctx.beginPath();
                        ctx.moveTo(x, y + 24);
                        ctx.quadraticCurveTo(x + 6, y + 4, x + 16, y + 6);
                        ctx.quadraticCurveTo(x + 28, y + 2, x + 34, y + 20);
                        ctx.quadraticCurveTo(x + 30, y + 28, x + 20, y + 26);
                        ctx.quadraticCurveTo(x + 10, y + 28, x, y + 24);
                        ctx.fill();
                        ctx.fillStyle = '#7a7a7a';
                        ctx.beginPath();
                        ctx.moveTo(x + 8, y + 14);
                        ctx.quadraticCurveTo(x + 16, y + 8, x + 24, y + 12);
                        ctx.fill();
                        break;
                    }
                    case 'lava': {
                        const wave = Math.sin(state.frameCount * 0.03 + d.x * 0.01) * 4;
                        ctx.fillStyle = '#3d1a0a';
                        ctx.fillRect(x, y + 10, d.w || 200, 40);
                        ctx.fillStyle = '#ff4400';
                        ctx.shadowColor = '#ff4400';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        const lw = d.w || 200;
                        for (let i = 0; i <= lw; i += 4) {
                            const lx = x + i;
                            const ly = y + 20 + Math.sin(i * 0.05 + state.frameCount * 0.04) * 6 +
                                Math.sin(i * 0.12 + state.frameCount * 0.06) * 4;
                            if (i === 0) ctx.moveTo(lx, ly);
                            else ctx.lineTo(lx, ly);
                        }
                        ctx.lineTo(x + lw, y + 40);
                        ctx.lineTo(x, y + 40);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        for (let i = 0; i < 5; i++) {
                            const px = x + (i * 37 + state.frameCount * 2) % lw;
                            const py = y + 16 + Math.sin(i * 3 + state.frameCount * 0.05) * 8;
                            ctx.fillStyle = 'rgba(255,200,100,0.4)';
                            ctx.beginPath();
                            ctx.arc(px, py, 3 + Math.sin(state.frameCount * 0.07 + i) * 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    }
                    case 'chain': {
                        ctx.strokeStyle = '#4a3a2a';
                        ctx.lineWidth = 3;
                        for (let i = 0; i < 12; i++) {
                            const cy2 = y + i * 12;
                            const ox = Math.sin(i * 0.8 + state.frameCount * 0.02) * 3;
                            ctx.beginPath();
                            ctx.arc(x + ox, cy2, 4, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        break;
                    }
                    case 'skull': {
                        ctx.fillStyle = '#5a4a3a';
                        ctx.beginPath();
                        ctx.arc(x + 16, y + 12, 14, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#3a2a1a';
                        ctx.beginPath();
                        ctx.arc(x + 10, y + 10, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x + 22, y + 10, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(x + 12, y + 16, 8, 4);
                        break;
                    }
                    case 'ruin': {
                        ctx.fillStyle = '#4a3a2a';
                        ctx.fillRect(x, y + 10, 30, 30);
                        ctx.fillStyle = '#3a2a1a';
                        ctx.fillRect(x + 6, y + 4, 18, 10);
                        ctx.fillRect(x + 12, y + 20, 6, 16);
                        ctx.fillStyle = '#5a4a3a';
                        for (let i = 0; i < 3; i++) {
                            ctx.fillRect(x + 4 + i * 10, y + 16 + i * 4, 4, 4);
                        }
                        break;
                    }
                    case 'stalactite': {
                        ctx.fillStyle = '#3a2a1a';
                        ctx.beginPath();
                        ctx.moveTo(x + 8, y + 30);
                        ctx.quadraticCurveTo(x + 16, y, x + 24, y + 30);
                        ctx.fill();
                        ctx.fillStyle = '#2a1a0a';
                        ctx.beginPath();
                        ctx.moveTo(x + 12, y + 30);
                        ctx.quadraticCurveTo(x + 16, y + 10, x + 20, y + 30);
                        ctx.fill();
                        break;
                    }
                    case 'cloud_bg': {
                        const s2 = d.s || 1;
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.beginPath();
                        ctx.arc(x, y, 50 * s2, 0, Math.PI * 2);
                        ctx.arc(x + 40 * s2, y - 20 * s2, 60 * s2, 0, Math.PI * 2);
                        ctx.arc(x + 80 * s2, y, 50 * s2, 0, Math.PI * 2);
                        ctx.arc(x + 40 * s2, y + 15 * s2, 40 * s2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case 'star': {
                        const twinkle = 0.3 + Math.sin(state.frameCount * 0.04 + d.x * 0.1) * 0.3;
                        ctx.fillStyle = `rgba(255,215,0,${twinkle})`;
                        ctx.shadowColor = '#ffd700';
                        ctx.shadowBlur = 20;
                        const sz2 = 8;
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const ang = (i * 1.256) - Math.PI / 2;
                            const r = i % 2 === 0 ? sz2 : sz2 * 0.4;
                            const sx2 = x + Math.cos(ang) * r;
                            const sy2 = y + Math.sin(ang) * r;
                            if (i === 0) ctx.moveTo(sx2, sy2);
                            else ctx.lineTo(sx2, sy2);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        break;
                    }
                    case 'gold_trim': {
                        ctx.fillStyle = 'rgba(255,215,0,0.12)';
                        ctx.fillRect(x, y, 40, 4);
                        ctx.fillRect(x + 4, y + 4, 32, 2);
                        ctx.fillStyle = 'rgba(255,215,0,0.06)';
                        for (let i = 0; i < 8; i++) {
                            ctx.fillRect(x + 4 + i * 4, y + 8, 2, 6);
                        }
                        break;
                    }
                }
                ctx.restore();
            }
        }

        // ---- DRAW GATE WITH JESUS+STALIN ----
        function drawGate() {
    if (!gate) return;
    const cx = state.camera.x,
        cy = state.camera.y;
    const x = gate.x - cx;
    const y = gate.y - cy;
    const isOpen = state.gateOpen;

    const memeImg = memeImages['jesus_stalin'];
    const showMeme = isOpen && memeImg && memeImg.complete && memeImg.naturalWidth > 0;

    ctx.save();

    if (isOpen) {
        ctx.shadowColor = 'rgba(255,215,0,0.3)';
        ctx.shadowBlur = 35;
    }

    const idx = isOpen ? 1 : 0;
    const img = gateImgs[idx];
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, gate.w, gate.h);
    } else {
        ctx.fillStyle = isOpen ? '#c9a87c' : '#7a6a5a';
        ctx.fillRect(x, y + 30, 14, gate.h - 30);
        ctx.fillRect(x + gate.w - 14, y + 30, 14, gate.h - 30);
        ctx.fillStyle = isOpen ? '#d4b896' : '#8a7a6a';
        ctx.beginPath();
        ctx.arc(x + gate.w / 2, y + 30, gate.w / 2, Math.PI, 0);
        ctx.fill();
    }

    // Мем появляется только если ворота открыты
    if (showMeme) {
        const memeW = gate.w * 0.6;
        const memeH = memeW / (memeImg.naturalWidth / memeImg.naturalHeight) + 50;
        const memeX = x + gate.w / 2 - memeW / 2;
        const memeY = y + 50 + (gate.h - 30) / 2 - memeH / 2;
        // Лёгкий фейд при появлении
        const d = dist(state.player.x + state.player.w / 2, state.player.y + state.player.h / 2,
            gate.x + gate.w / 2, gate.y + gate.h / 2);
        const fade = Math.max(0, Math.min(1, 1 - (d - 50) / 300));
        ctx.globalAlpha = fade;
        ctx.shadowBlur = 40;
        ctx.shadowColor = 'rgba(255,215,0,0.5)';
        ctx.drawImage(memeImg, memeX, memeY, memeW, memeH);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Кнопка входа
    if (state.gateButtonRect) {
        const bx = state.gateButtonRect.x - cx;
        const by = state.gateButtonRect.y - cy;
        ctx.save();
        ctx.shadowColor = 'rgba(255,215,0,0.4)';
        ctx.shadowBlur = 20;
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath();
        ctx.roundRect(bx, by, state.gateButtonRect.w, state.gateButtonRect.h, 12);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚪 Войти', bx + state.gateButtonRect.w / 2, by + state.gateButtonRect.h / 2);
        ctx.restore();
    }
}

                // ---- DRAW PLAYER ----
function drawPlayer() {
    const p = state.player;
    const cx = state.camera.x,
        cy = state.camera.y;
    const x = p.x - cx;
    const y = p.y - cy;

    // Тень
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(x + p.w / 2, y + p.h + 3, p.w / 2.5, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Мигание при неуязвимости
    let blinkActive = false;
    if (state.invincible > 0) {
        if (Math.floor(state.frameCount / 3) % 2 === 0) {
            blinkActive = true;
        }
    }

    if (blinkActive) {
        ctx.save();
        ctx.globalAlpha = 0.35;
    }

    let img;
    if (p.anim === 'idle') img = idleImgs[p.frame % 2];
    else if (p.anim === 'walk') img = walkImgs[p.frame % 4];
    else if (p.anim === 'jump') img = jumpImgs[Math.min(p.frame, 5)];
    else if (p.anim === 'fall') img = jumpImgs[5];
    else img = idleImgs[0];

    ctx.save();
    // Исправление: проверяем либо naturalWidth (для Image), либо width (для Canvas)
    if (img && img.complete && ((img.naturalWidth && img.naturalWidth > 0) || (img.width && img.width > 0))) {
        const targetW = p.w;
        const targetH = p.h;
        const srcW = img.naturalWidth || img.width;
        const srcH = img.naturalHeight || img.height;

        // Масштабируем так, чтобы ВЫСОТА всегда была полной (targetH)
        const scale = targetH / srcH;
        const dw = srcW * scale; // ширина рассчитывается пропорционально
        const dh = targetH;      // высота фиксирована

        // Центрируем по горизонтали (если ширина меньше или больше хитбокса)
        const dx = x + (targetW - dw) / 2;
        const dy = y; // привязываем к верхнему краю коллизии (ступни будут ровно на нижнем крае)

        if (p.dir === -1) {
            ctx.translate(dx + dw, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, dw, dh);
        } else {
            ctx.drawImage(img, dx, dy, dw, dh);
        }
    } else {
        // Запасная отрисовка (смайлик)
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(x, y, p.w, p.h);
        ctx.fillStyle = '#fff';
        ctx.font = '36px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('😊', x + p.w / 2, y + p.h / 2);
    }
    ctx.restore();

    if (blinkActive) {
        ctx.restore();
    }
}

            const startX = V_W - 150;

                const hx = startX + i * spacing;

// ---- DRAW BACKGROUND ----
        function drawBackground() {
            const data = levelData.bg;
            const grad = ctx.createLinearGradient(0, 0, 0, V_H);
            grad.addColorStop(0, data.skyTop);
            grad.addColorStop(1, data.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, V_W, V_H);

            const cx = state.camera.x,
                cy = state.camera.y;
            ctx.save();

            ctx.fillStyle = data.hill2;
            ctx.beginPath();
            ctx.moveTo(0, V_H);
            for (let x = 0; x <= V_W + 20; x += 10) {
                const h = V_H - 50 - Math.sin((x + cx * 0.04) * 0.012 + 2) * 35 - Math.sin((x + cx * 0.07) *
                    0.018 + 5) * 20;
                ctx.lineTo(x, h - cy * 0.1);
            }
            ctx.lineTo(V_W, V_H);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = data.hill1;
            ctx.beginPath();
            ctx.moveTo(0, V_H);
            for (let x = 0; x <= V_W + 20; x += 10) {
                const h = V_H - 80 - Math.sin((x + cx * 0.07) * 0.01 + 1) * 40 - Math.sin((x + cx * 0.1) *
                    0.015 + 3) * 25;
                ctx.lineTo(x, h - cy * 0.15);
            }
            ctx.lineTo(V_W, V_H);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = data.ground;
            ctx.fillRect(0, V_H - 40 - cy * 0.2, V_W, 60 + cy * 0.2);
            ctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let i = 0; i < 30; i++) {
                const gx = (i * 70 + cx * 0.2) % (V_W + 100) - 50;
                const gy = V_H - 12 + Math.sin(i * 1.5 + cx * 0.01) * 6 - cy * 0.2;
                ctx.fillRect(gx, gy, 18, 5);
            }
            ctx.restore();
        }

        // ---- DRAW CLOUDS ----
        function drawClouds() {
            const cy = state.camera.y;
            for (const c of state.clouds) {
                const x = c.x;
                const y = c.y - cy * 0.08;
                const s = c.size;
                ctx.save();
                ctx.globalAlpha = c.opacity;
                ctx.shadowColor = 'rgba(0,0,0,0.08)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = c.color || 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(x, y, s * 0.35, 0, Math.PI * 2);
                ctx.arc(x + s * 0.3, y - s * 0.15, s * 0.45, 0, Math.PI * 2);
                ctx.arc(x + s * 0.6, y, s * 0.35, 0, Math.PI * 2);
                ctx.arc(x + s * 0.3, y + s * 0.1, s * 0.28, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ---- DRAW BG PARTICLES ----
        function drawBgParticles() {
            const cy = state.camera.y;
            for (const p of bgParticles) {
                const x = p.x;
                const y = p.y + Math.sin(state.frameCount * 0.01 + p.phase) * 20 - cy * 0.05;
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(x, y, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                p.x += p.speed * 0.15;
                if (p.x > V_W + 20) p.x = -20;
            }
        }

        // ---- DRAW PLUSHS ----
        function drawPlushes() {
            const cx = state.camera.x,
                cy = state.camera.y;
            const time = state.frameCount * 0.02;
            for (let i = 0; i < plushes.length; i++) {
                const plush = plushes[i];
                if (plush.collected) continue;
                const size = plush.size || 48;
                const bob = Math.sin(plush.bobPhase) * 4 * SCALE;
                const x = plush.x - cx;
                const y = plush.y + bob - cy;
                const glow = 0.5 + Math.sin(plush.bobPhase * 1.5) * 0.3;
                ctx.save();
                ctx.shadowColor = `rgba(255,215,0,${glow * 0.3})`;
                ctx.shadowBlur = 25;
                const imgIdx = plush.imgIdx !== undefined ? plush.imgIdx : (i % plushImages.length);
                const img = plushImages[imgIdx % plushImages.length];
                if (img && img.complete && img.naturalWidth > 0) {
                    const scale2 = Math.min(size / img.naturalWidth, size / img.naturalHeight);
                    const w = img.naturalWidth * scale2;
                    const h = img.naturalHeight * scale2;
                    ctx.drawImage(img, x + (size - w) / 2, y + (size - h) / 2, w, h);
                } else {
                    ctx.fillStyle = '#ffd34d';
                    ctx.beginPath();
                    ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(x + size / 2 - 6, y + size / 2 - 4, 3, 0, Math.PI * 2);
                    ctx.arc(x + size / 2 + 6, y + size / 2 - 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                if (i % 2 === 0) {
                    const sparkX = x + size / 2 + Math.sin(time + i) * 12;
                    const sparkY = y + size / 2 + Math.cos(time * 0.7 + i * 0.5) * 12;
                    ctx.save();
                    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(time + i) * 0.2})`;
                    ctx.shadowColor = '#fff';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // ---- DRAW SECRET MEMES ----
        function drawSecretMemes() {
            const cx = state.camera.x,
                cy = state.camera.y;
            for (const m of secretMemes) {
                if (m.collected) continue;
                const x = m.x - cx;
                const y = m.y + Math.sin(state.frameCount * 0.04) * 4 * SCALE - cy;
                const img = memeImages[m.key];
                ctx.save();
                ctx.shadowColor = 'rgba(255,200,0,0.4)';
                ctx.shadowBlur = 25;
                if (img && img.complete && img.naturalWidth > 0) {
                    const aspect = img.naturalWidth / img.naturalHeight;
                    let dw = m.w,
                        dh = m.h;
                    if (aspect > 1) { dh = m.w / aspect; } else { dw = m.h * aspect; }
                    ctx.drawImage(img, x + (m.w - dw) / 2, y + (m.h - dh) / 2, dw, dh);
                } else {
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(x, y, m.w, m.h);
                    ctx.fillStyle = '#000';
                    ctx.font = '18px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🧠', x + m.w / 2, y + m.h / 2);
                }
                ctx.restore();
            }
        }

                // ---- DRAW ACHIEVEMENT TOAST ----
        function drawAchievementToast() {
            if (!state.achievementToast) return;
            const a = state.achievementToast;

            const w = 780, h = 175;
            const x = V_W / 2 - w / 2, y = 110;

            ctx.save();
            ctx.globalAlpha = alpha;

            // Рисуем фоновую картинку
            const bg = achBgImgs[a.bg % achBgImgs.length];

            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.70)';
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 16);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,215,0,0.25)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 16);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Если это второй фон (fon_1) — рисуем кубок выше и правее

                ctx.fillText('🏆', x + 130, y + 60);
            }

            // Текст

            ctx.shadowColor = 'rgba(0,0,0,0.8)';

            let titleX = x + w / 2;

            if (a.bg === 1) {
                // Для зелёного фона сдвигаем текст правее, чтобы он не наезжал на надпись "Достижение разблокировано"
                titleX = x + w / 2 + 65;

        function gameLoop() {
            state.frameCount++;

            if (state.frameCount === 1) initAudio();

            if (!state.gameOver && !state.victoryTriggered && !state.paused && !state.creditsActive && !state
                .finalCelebration && state.gameStarted) {
                updatePlayer();
                updateBoxes(); // <-- добавили обновление коробок
                updateEnemies();
                if (state.nyanActive) updateNyan();
                updateSpikes();
                updatePlushes();
                updateEasterEgg();
                updateSecretMemes();
                updateGate();
                updateCheckpoints();
                updateCamera();
                updateClouds();
                updateParticles();

                for (const p of bgParticles) {
                    p.x += p.speed * 0.12;
                    if (p.x > V_W + 20) p.x = -20;
                }

                checkLevelCompletion();
                checkLevelEnd();

                if (!state.fallingInPit && state.player.y > V_H + 200) {
                    if (state.lives > 1) { state.lives--;
                        sfxDie();
                        respawnAtCheckpoint(); } else { state.lives = 0;
                        sfxDie();
                        triggerGameOver(); }
                }
                if (state.frameCount % 120 === 0) saveProgress();

                if (state.invincible > 0) state.invincible--;

            } else if (state.gameOver) {
                state.gameOverTimer--;
                if (state.gameOverTimer === 0) {
                    showDeathImage();
                    state.gameOverTimer = -1;
                }
            }

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scale = canvas.width / V_W;
            ctx.translate(0, 0);
            ctx.scale(scale, scale);
            if (state.introCreditsActive) {
                drawIntroCredits();
                ctx.restore();
                requestAnimationFrame(gameLoop);
                return;
            }
            if (state.gameStarted) {
                drawBackground();
                drawClouds();
                drawBgParticles();
                drawPlatforms();
                                drawSpikes();
                drawBoxes(); // <-- отрисовка коробок
                drawDecorations();

                drawPlushes();
                drawEasterEgg();
                drawPit();
                drawSecretMemes();
                drawEnemies();
                drawGate();
                drawCake();
                drawCheckpoints();
                drawPlayer();
                drawParticles();
                if (state.nyanActive) drawNyan();
                drawHUD();
                drawAchievementToast();
                drawMessage();
                drawLevelTransition();
                drawPauseOverlay();

                if (state.gameOver) drawGameOver();
                if (state.victoryTriggered && !state.creditsActive && !state.finalCelebration) drawVictoryScreen();
                if (state.creditsActive) drawCredits();
                if (state.finalCelebration) drawFinalCelebration();
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        // ---- POLYFILL roundRect ----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ---- INIT ----
        async function init() {
            await loadAllAssets();
            showIntro();
            resizeCanvas();
            gameLoop();
        }

        // ---- START ----
        init().catch(() => {
            showIntro();
            resizeCanvas();
            gameLoop();
        });

        document.addEventListener('fullscreenchange', () => {
            setTimeout(resizeCanvas, 100);
        });

        console.log('🎂 С новым годом, Алина! ');
        console.log('🐱 Найди кота Максвела в Преисподней!');
        console.log('🎵 Найди cat_mus для музыки!');
    </script>
</body>
</html>
